[project]
name = "dsai-vault"
version = "0.1.0"
description = "Courseware study site: Markdown/YAML course content, rendered by Django."
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "gunicorn>=26.2",
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2",
    "mdit-py-plugins>=0.6",
    "pydantic>=2.14",
    "pygments>=2.21.0",
    "pyyaml>=6.0.3",
    "watchfiles>=1.3.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=8.0.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations", "static", "courses", "reference", "docs/example-course"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]
