{% load ui %}{% comment %} Beside an item in a list, for the owner: that it is not public. {% endcomment %}{% if owner and item.visibility != "public" %}<span class="shown-mark" title="{% if item.visibility == 'private' %}Only you see this{% else %}Not listed for anyone else; open to whoever has the address{% endif %}">{% icon "hidden" %}{{ item.get_visibility_display }}</span>{% endif %}
